name: PT2VHFSpeedAlert
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  PT2VHFSpeedAlert:
    type: application
    platform: iOS
    sources:
      - path: SpeedAlertIOS/Sources
      - path: SpeedAlertIOS/Resources/LaunchScreen.storyboard
        buildPhase: resources
      - path: SpeedAlertIOS/Resources/Assets.xcassets
      - path: SpeedAlertIOS/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: SpeedAlertIOS/Offline/df_roads_v3.sqlite
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pt2vhf.speedalert.ios
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.9"
        CURRENT_PROJECT_VERSION: "109"
        INFOPLIST_FILE: SpeedAlertIOS/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
  PT2VHFSpeedAlertTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpeedAlertIOS/Tests
    dependencies:
      - target: PT2VHFSpeedAlert
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pt2vhf.speedalert.ios.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  PT2VHFSpeedAlert:
    build:
      targets:
        PT2VHFSpeedAlert: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PT2VHFSpeedAlertTests
    archive:
      config: Release

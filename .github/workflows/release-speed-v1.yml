name: Publish PT2VHF Speed Alert stable 1.0
on:
  # Manual only: a stable signed release must never be published as a side effect of a merge.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: speed-alert-stable-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_VERSION: "1.0.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: android-actions/setup-android@v4
      - name: Verify permanent signing secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "$(printenv "$key")" ]; then
              echo "::error::Missing $key. Stable release requires a permanent keystore. Do NOT publish random debug-signed APKs."
              exit 2
            fi
          done
          echo "Permanent signing secrets are present."
      - name: Restore and verify signing certificate
        shell: bash
        run: |
          set -euo pipefail
          export PT2VHF_SIGNING_STORE_FILE="$RUNNER_TEMP/speed-alert-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | base64 -d > "$PT2VHF_SIGNING_STORE_FILE"
          test -s "$PT2VHF_SIGNING_STORE_FILE"
          chmod 600 "$PT2VHF_SIGNING_STORE_FILE"
          keytool -list -keystore "$PT2VHF_SIGNING_STORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null
          echo "PT2VHF_SIGNING_STORE_FILE=$PT2VHF_SIGNING_STORE_FILE" >> "$GITHUB_ENV"
          unset ANDROID_KEYSTORE_BASE64
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore pinned offline OSM database (data/osm-db.lock)
        run: bash scripts/restore_osm_db.sh app/src/github/assets/df_roads_v3.sqlite
      - name: Compile, lint and assemble signed release
        run: |
          set -euo pipefail
          gradle :app:assembleGithubRelease :app:lintGithubRelease --no-daemon --stacktrace
      - name: Validate signed APK, certificate and release version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          src=app/build/outputs/apk/github/release/app-github-release.apk
          test -s "$src"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump badging "$src" | grep "versionName='$RELEASE_VERSION'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$src"
          unzip -l "$src" | grep assets/df_roads_v3.sqlite
          cp "$src" "dist/PT2VHF-Speed-Alert-v$RELEASE_VERSION.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish signed stable release to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release v$version already exists. Refuse to overwrite the stable APK."
            exit 3
          fi
          gh release create "v$version" dist/*.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PT2VHF Speed Alert 1.0 (v$version)" \
            --notes "Stable 1.0 release: driver dashboard, six background alarm tones, offline OSM roads and cameras, site-based OTA, and default screen-on. A one-time migration from historical per-build debug certificates is needed. Keep this signing key for all future updates. Field verification of road limits and cameras remains necessary." \
            --latest
          echo "Published stable signed release v$version"

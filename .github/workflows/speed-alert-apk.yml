name: Build standalone Speed Alert APK
on:
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Kotlin before downloading map data
        run: gradle :app:compileGithubDebugKotlin :app:compilePlayDebugKotlin :app:testPlayDebugUnitTest --no-daemon --stacktrace
      - name: Restore pinned offline OSM database (data/osm-db.lock)
        run: bash scripts/restore_osm_db.sh app/src/github/assets/df_roads_v3.sqlite
      - name: Build Android v1.0.9 candidate
        run: gradle :app:assembleGithubDebug :app:assemblePlayDebug --no-daemon --stacktrace
      - name: Validate APK and offline database
        run: |
          test -s app/build/outputs/apk/github/debug/app-github-debug.apk
          sha256sum app/build/outputs/apk/github/debug/app-github-debug.apk
          unzip -l app/build/outputs/apk/github/debug/app-github-debug.apk | grep -E 'classes.dex|assets/df_roads_v3.sqlite|ic_speed_alert'
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-Speed-Alert-1.0.9-candidate-debug-APK
          path: |
            app/build/outputs/apk/github/debug/app-github-debug.apk
            app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error
          retention-days: 30

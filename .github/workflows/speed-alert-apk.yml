name: Build standalone Speed Alert APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build regional offline OSM v3 speed/name/radar database
        run: |
          set -euo pipefail
          python -m pip install osmium
          curl --fail --location --retry 3 --connect-timeout 25 \
            -o /tmp/centro-oeste.osm.pbf \
            https://download.geofabrik.de/south-america/brazil/centro-oeste-latest.osm.pbf
          python tools/build_osm_v3.py /tmp/centro-oeste.osm.pbf app/src/main/assets/df_roads_v3.sqlite
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('app/src/main/assets/df_roads_v3.sqlite')
          assert db.execute('PRAGMA quick_check').fetchone()[0]=='ok'
          assert db.execute('PRAGMA user_version').fetchone()[0]==3
          counts=[db.execute('SELECT COUNT(*) FROM '+t).fetchone()[0] for t in ('roads','road_tiles','cameras')]
          assert counts[0]>=50000 and counts[1]>=50000
          assert db.execute("SELECT COUNT(*) FROM roads WHERE name<>'' OR ref<>''").fetchone()[0]>20000
          print('OFFLINE_V3_OK',counts)
          db.close()
          PY
      - name: Build Android v1.0.3 beta
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK and offline database
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes.dex|assets/df_roads_v3.sqlite|ic_speed_alert'
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-Speed-Alert-1.0.3-beta1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

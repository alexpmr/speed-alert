name: Build standalone Speed Alert APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Kotlin before downloading map data
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Build offline OSM v3 data with validated fallback
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          PBF=/tmp/centro-oeste.osm.pbf
          if curl --fail --location --retry 1 --retry-all-errors --connect-timeout 8 --max-time 65 \
            -o "$PBF" https://download-ext2.geofabrik.de/south-america/brazil/centro-oeste-latest.osm.pbf ||
             curl --fail --location --retry 2 --retry-all-errors --max-time 160 \
            -o "$PBF" https://download.geofabrik.de/south-america/brazil/centro-oeste-latest.osm.pbf; then
            python -m pip install osmium
            python tools/build_osm_v3.py "$PBF" app/src/main/assets/df_roads_v3.sqlite
            echo "OFFLINE_SOURCE=GE0FABRIK_FULL"
          else
            echo "::warning::Geofabrik unavailable: using validated v2 limits without street/radar coverage"
            curl --fail --location --retry 3 -o /tmp/previous.apk \
              https://github.com/alexpmr/speed-alert/releases/download/v1.0.2-beta.1/PT2VHF-Speed-Alert-v1.0.2-beta.1.apk
            unzip -p /tmp/previous.apk assets/df_roads_v2.sqlite > /tmp/old-v2.sqlite
            python tools/upgrade_v2_to_v3.py /tmp/old-v2.sqlite app/src/main/assets/df_roads_v3.sqlite
            echo "OFFLINE_SOURCE=FALLBACK_V2"
          fi
          python - <<'PY'
          import sqlite3
          p='app/src/main/assets/df_roads_v3.sqlite'
          db=sqlite3.connect(p)
          assert db.execute('PRAGMA quick_check').fetchone()[0]=='ok'
          assert db.execute('PRAGMA user_version').fetchone()[0]==3
          counts=[db.execute('SELECT COUNT(*) FROM '+t).fetchone()[0] for t in ('roads','road_tiles','cameras')]
          assert counts[0]>=50000 and counts[1]>=50000
          named=db.execute("SELECT COUNT(*) FROM roads WHERE name<>'' OR ref<>''").fetchone()[0]
          print("OFFLINE_V3_OK",counts,"named segments",named)
          db.close()
          PY
      - name: Build Android v1.0.3 beta
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK and offline database
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes.dex|assets/df_roads_v3.sqlite|ic_speed_alert'
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-Speed-Alert-1.0.3-beta1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

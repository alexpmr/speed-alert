name: Build standalone Speed Alert APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Generate offline OSM speed-limit database
        run: |
          python -m pip install osmium
          curl --fail --location --retry 3 -o /tmp/centro-oeste.osm.pbf             https://download.geofabrik.de/south-america/brazil/centro-oeste-latest.osm.pbf
          python tools/build_osm_db.py /tmp/centro-oeste.osm.pbf app/src/main/assets/df_roads.sqlite
      - name: Build Android v1.0.1
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Check APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes.dex|assets/df_roads.sqlite|ic_speed_alert'
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-Speed-Alert-1.0.1-beta1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

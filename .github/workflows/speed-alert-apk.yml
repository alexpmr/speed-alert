name: Build standalone Speed Alert APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Kotlin before downloading map data
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace
      - name: Reuse verified OSM v3 dataset from preceding beta
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 180 \
            -o /tmp/previous.apk \
            https://github.com/alexpmr/speed-alert/releases/download/v1.0.3-beta.1/PT2VHF-Speed-Alert-v1.0.3-beta.1.apk
          echo "9fab2b29e90f2d5b95682d257206e4f49a78d33c7e5562a1117c1588fa989b00  /tmp/previous.apk" | sha256sum -c -
          mkdir -p app/src/main/assets
          unzip -p /tmp/previous.apk assets/df_roads_v3.sqlite > app/src/main/assets/df_roads_v3.sqlite
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect("app/src/main/assets/df_roads_v3.sqlite")
          assert db.execute("PRAGMA quick_check").fetchone()[0] == "ok"
          assert db.execute("PRAGMA user_version").fetchone()[0] == 3
          roads=db.execute("SELECT COUNT(*) FROM roads").fetchone()[0]
          named=db.execute("SELECT COUNT(*) FROM roads WHERE name<>'' OR ref<>''").fetchone()[0]
          cameras=db.execute("SELECT COUNT(*) FROM cameras").fetchone()[0]
          assert roads>200000 and named>150000 and cameras>=100
          print("Verified OSM v3 restored",roads,"segments",named,"named",cameras,"radars")
          db.close()
          PY
      - name: Build Android v1.0.4 beta
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK and offline database
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes.dex|assets/df_roads_v3.sqlite|ic_speed_alert'
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-Speed-Alert-1.0.4-beta1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: Validate release signing without publishing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-release-signing.yml'
      - 'app/src/main/java/com/pt2vhf/speedalert/MainActivity.kt'
      - 'app/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'app/src/play/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore pinned offline OSM database (data/osm-db.lock)
        run: bash scripts/restore_osm_db.sh app/src/github/assets/df_roads_v3.sqlite
      - name: Smoke-test release Gradle signing and lint using ephemeral QA key
        shell: bash
        run: |
          set -euo pipefail
          export PT2VHF_SIGNING_STORE_FILE="$RUNNER_TEMP/throwaway-QA-not-for-users.jks"
          export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -base64 30)"
          export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export ANDROID_KEY_ALIAS="speedalert"
          keytool -genkeypair -noprompt \
            -keystore "$PT2VHF_SIGNING_STORE_FILE" \
            -storetype PKCS12 -alias speedalert -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=CI QA Not For Distribution, O=PT2VHF, C=BR" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD"
          gradle :app:assembleGithubRelease :app:lintGithubRelease :app:bundlePlayRelease :app:lintPlayRelease --no-daemon --stacktrace
          test -s app/build/outputs/apk/github/release/app-github-release.apk
          test -s app/build/outputs/bundle/playRelease/app-play-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/github/release/app-github-release.apk
          echo "Release signing and lint QA succeeded. APK purposely not uploaded or published."

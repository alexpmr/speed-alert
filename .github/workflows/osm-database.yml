name: Rebuild offline OSM database
# Builds, from current OpenStreetMap extracts:
#   - df_roads_v3.sqlite (DF and surroundings; bundled in the site APK and iOS) -> data/osm-db.lock
#   - 1x1 degree tiles of Centro-Oeste, Sul and Sudeste (downloaded by the app) -> data/tiles.json
# publishes them as one pre-release and opens a pull request updating both files.
# Merging that PR updates the tiles on every installed app (no new app version needed);
# the DF database reaches the site APK / iOS with their next build.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 3 * *'   # monthly, day 3 at 06:17 UTC
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: speed-alert-osm-database
  cancel-in-progress: false
env:
  REGION_PROFILE: slim
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      max-parallel: 1          # one extract download at a time (Geofabrik rate limits)
      matrix:
        region: [centro-oeste, sul, sudeste]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install osmium==4.*
      - name: Download extract
        run: bash scripts/fetch_osm_extract.sh ${{ matrix.region }} "$RUNNER_TEMP/r.osm.pbf"
      - name: Build regional database
        run: |
          python3 -I tools/build_osm_v3.py "$RUNNER_TEMP/r.osm.pbf" dist/${{ matrix.region }}.sqlite \
            --bbox none --profile "$REGION_PROFILE" --region ${{ matrix.region }} \
            --label ${{ matrix.region }} --min-roads 100000
      - name: Build DF database (full profile, DF bounding box)
        if: matrix.region == 'centro-oeste'
        run: python3 -I tools/build_osm_v3.py "$RUNNER_TEMP/r.osm.pbf" dist/df_roads_v3.sqlite --region df
      - uses: actions/upload-artifact@v4
        with:
          name: osm-${{ matrix.region }}
          path: dist/*.sqlite
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: regions
          merge-multiple: true
      - name: Build tiles
        shell: bash
        run: |
          set -euo pipefail
          tag="osm-tiles-$(date -u +%Y%m%d-%H%M)"
          python3 -I tools/build_tiles.py dist "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/" \
            regions/centro-oeste.sqlite regions/sul.sqlite regions/sudeste.sqlite
          echo "TAG=$tag" >> "$GITHUB_ENV"
          mv regions/df_roads_v3.sqlite dist/
          n=$(ls dist/*.sqlite.gz | wc -l)
          [ "$n" -ge 100 ] && [ "$n" -le 990 ] || { echo "::error::Unexpected tile count $n (release asset limit is 1000)"; exit 3; }
      - name: Validate and compare with what is shipped
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/restore_osm_db.sh "$RUNNER_TEMP/df_current.sqlite"
          python3 -I - "$RUNNER_TEMP/df_current.sqlite" dist/df_roads_v3.sqlite data/tiles.json dist/tiles.json > dist/REPORT.md <<'PY'
          import sqlite3,sys,json,os
          cur_df,new_df,cur_m,new_m=sys.argv[1:5]
          def stats(p):
              d=sqlite3.connect(p)
              assert d.execute("PRAGMA quick_check").fetchone()[0]=="ok"
              assert d.execute("PRAGMA user_version").fetchone()[0]==3
              q=lambda s:d.execute(s).fetchone()[0]
              return {"trechos":q("SELECT COUNT(*) FROM roads"),
                      "com limite":q("SELECT COUNT(*) FROM roads WHERE fwd IS NOT NULL OR bwd IS NOT NULL"),
                      "radares":q("SELECT COUNT(*) FROM cameras")}
          o,n=stats(cur_df),stats(new_df)
          print("### Base DF (APK do site / iOS)\n| métrica | atual | nova |\n|---|---|---|")
          for k in n: print(f"| {k} | {o[k]} | {n[k]} |")
          for k in ("trechos","com limite"): assert n[k]>=0.9*o[k],f"DF {k}: {o[k]} -> {n[k]}"
          new=json.load(open(new_m))["tiles"]
          old=json.load(open(cur_m))["tiles"] if os.path.exists(cur_m) else {}
          tot=lambda t,k:sum(v[k] for v in t.values())
          print("\n### Blocos (Centro-Oeste, Sul, Sudeste)\n| métrica | atual | nova |\n|---|---|---|")
          print(f"| blocos | {len(old) or '—'} | {len(new)} |")
          for k in ("roads","cameras","gz_bytes"):
              print(f"| {k} | {tot(old,k) if old else '—'} | {tot(new,k)} |")
          if old:
              assert len(new)>=0.9*len(old) and tot(new,"roads")>=0.9*tot(old,"roads"),"tiles shrank sharply"
          big=max(new.items(),key=lambda kv:kv[1]["gz_bytes"])
          print(f"\nMaior bloco: {big[0]} ({big[1]['gz_bytes']//1048576} MB comprimido).")
          PY
          cat dist/REPORT.md | tee -a "$GITHUB_STEP_SUMMARY"
          (cd dist && sha256sum df_roads_v3.sqlite > SHA256SUMS.txt)
      - name: Publish pre-release and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.sqlite.gz dist/df_roads_v3.sqlite dist/tiles.json dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Bases offline OSM $TAG" --notes-file dist/REPORT.md
          dl="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          sed -i "s#^URL=.*#URL=$dl/df_roads_v3.sqlite#; s#^SHA256=.*#SHA256=$(cut -d' ' -f1 dist/SHA256SUMS.txt)#" data/osm-db.lock
          cp dist/tiles.json data/tiles.json
          branch="osm-db/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/osm-db.lock data/tiles.json
          git commit -m "data: offline OSM tiles and DF database $TAG"
          git push origin "$branch"
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base "${GITHUB_REF_NAME}" \
              --title "Atualizar bases offline OSM ($TAG)" \
              --body "$(printf 'Bases regeneradas a partir dos extratos OSM atuais.\n\n%s\n\nAo fazer o merge, os apps instalados passam a baixar os blocos novos (o índice data/tiles.json é lido pelo app). A base do DF entra no APK do site e no iOS na próxima versão.' "$(cat dist/REPORT.md)")"; then
            echo "::warning::Could not open the PR (enable 'Allow GitHub Actions to create pull requests' in Settings → Actions). Branch $branch was pushed; open the PR manually."
          fi
